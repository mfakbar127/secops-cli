provider: threatstream
name: Anomali ThreatStream
description: Reputation lookups using Anomali ThreatStream.
http_header:
  Accept: application/json
  Authorization: "apikey ${env.ANOMALI_USERNAME}:${env.ANOMALI_API_KEY}"
functions:
  lookup_domain:
    description: Search Anomali ThreatStream for reputation of a domain.
    args:
      domain:
        type: string
        required: true
        description: Domain to lookup.
    request:
      method: GET
      url: https://api.threatstream.com/api/v2/intelligence/
      query:
        value: "${args.domain}"
        type: domain
        status: active
        limit: 0
  lookup_email:
    description: Search Anomali ThreatStream for reputation of an email address.
    args:
      email:
        type: string
        required: true
        description: Email address to lookup.
    request:
      method: GET
      url: https://api.threatstream.com/api/v2/intelligence/
      query:
        value: "${args.email}"
        type: email
        status: active
        limit: 0
  lookup_file_hash:
    description: Search Anomali ThreatStream for reputation of a file hash.
    args:
      file_hash:
        type: string
        required: true
        description: File hash to lookup.
    request:
      method: GET
      url: https://api.threatstream.com/api/v2/intelligence/
      query:
        value: "${args.file_hash}"
        type: md5
        status: active
        limit: 0
  lookup_ip_address:
    description: Search Anomali ThreatStream for reputation of an IP address.
    args:
      ip_address:
        type: string
        required: true
        description: IP address to lookup.
    request:
      method: GET
      url: https://api.threatstream.com/api/v2/intelligence/
      query:
        value: "${args.ip_address}"
        type: ip
        status: active
        limit: 0
  lookup_url:
    description: Search Anomali ThreatStream for reputation of a URL.
    args:
      url:
        type: string
        required: true
        description: URL to lookup.
    request:
      method: GET
      url: https://api.threatstream.com/api/v2/intelligence/
      query:
        value: "${args.url}"
        type: url
        status: active
        limit: 0
