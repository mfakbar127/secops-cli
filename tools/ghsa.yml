provider: ghsa
name: GitHub Security Advisories (GHSA)
description: Anonymous lookups against the GitHub Advisory Database.
http_header:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"
functions:
  search:
    description: Browse and filter advisories in the GitHub Advisory Database.
    args:
      ecosystem:
        type: string
        required: false
        description: Package ecosystem to filter by, e.g. npm, pip, maven, nuget, rubygems, go, composer, rust, pub, erlang, actions, swift.
      severity:
        type: string
        required: false
        description: Severity level to filter by. One of critical, high, medium, low.
      type:
        type: string
        required: false
        default: reviewed
        description: Advisory type to filter by, as accepted by GitHub's advisories API (e.g. reviewed, malware, unreviewed).
      per_page:
        type: number
        required: false
        default: 20
        description: Maximum number of advisories to return. Capped at around 100 by the upstream API.
    request:
      method: GET
      url: https://api.github.com/advisories
      query:
        ecosystem: "${args.ecosystem}"
        severity: "${args.severity}"
        type: "${args.type}"
        per_page: "${args.per_page}"

  get:
    description: Retrieve a single advisory by its GHSA identifier.
    args:
      id:
        type: string
        required: true
        description: GHSA identifier of the advisory to retrieve, e.g. 'GHSA-jfh8-c2jp-5v3q'.
    request:
      method: GET
      url: "https://api.github.com/advisories/${args.id}"

  get_by_cve:
    description: Resolve a CVE identifier to its corresponding GitHub Security Advisory.
    args:
      cve_id:
        type: string
        required: true
        description: CVE identifier to resolve to its GitHub advisory, e.g. 'CVE-2021-44228'.
    request:
      method: GET
      url: https://api.github.com/advisories
      query:
        cve_id: "${args.cve_id}"
        per_page: 1
