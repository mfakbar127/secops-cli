provider: github
name: GitHub
description: Exploit and proof-of-concept intelligence lookups using GitHub, for finding public PoC code and detection templates related to a CVE.
functions:
  search_poc_repos:
    description: Search GitHub repositories for public proof-of-concept exploit code related to a CVE, ranked by stars.
    args:
      cve_id:
        type: string
        required: true
        description: CVE ID to search for public proof-of-concept exploit code, e.g. 'CVE-2024-3400'.
    request:
      method: GET
      url: https://api.github.com/search/repositories
      headers:
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
      query:
        q: "${args.cve_id} poc OR exploit OR vulnerability"
        sort: stars
        order: desc
        per_page: 10
  check_nuclei_template:
    description: Check whether ProjectDiscovery's nuclei-templates repository has a published detection template for a CVE. A 200 response means a template exists; a 404 means it doesn't.
    args:
      cve_id:
        type: string
        required: true
        description: Full CVE ID in uppercase, e.g. 'CVE-2024-3400' — used as the template filename.
      year:
        type: number
        required: true
        description: Year portion of the CVE ID, e.g. 2024 for CVE-2024-3400. Must be supplied explicitly since this schema cannot derive it from cve_id.
    request:
      method: GET
      url: "https://raw.githubusercontent.com/projectdiscovery/nuclei-templates/main/http/cves/${args.year}/${args.cve_id}.yaml"
