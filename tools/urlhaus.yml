provider: urlhaus
name: URLhaus
description: Public URL malware intelligence lookups.
http_header:
  Content-Type: application/x-www-form-urlencoded
functions:
  lookup_url:
    description: Look up a URL in URLhaus.
    args:
      url:
        type: string
        required: true
        description: URL to look up.
    request:
      method: POST
      url: https://urlhaus-api.abuse.ch/v1/url/
      body:
        url: "${args.url}"
