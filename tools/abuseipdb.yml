provider: abuseipdb
name: AbuseIPDB
description: IP reputation checks using AbuseIPDB.
functions:
  check_ip:
    description: Check an IP address reputation score.
    args:
      ip:
        type: string
        required: true
        description: IP address to check.
      maxAgeInDays:
        type: number
        required: false
        default: 90
        description: Maximum report age in days.
    request:
      method: GET
      url: https://api.abuseipdb.com/api/v2/check
      headers:
        Key: "${env.ABUSEIPDB_API_KEY}"
        Accept: application/json
      query:
        ipAddress: "${args.ip}"
        maxAgeInDays: "${args.maxAgeInDays}"
