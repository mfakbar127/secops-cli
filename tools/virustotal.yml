provider: virustotal
name: VirusTotal
description: Threat intelligence lookups using VirusTotal.
http_header:
  x-apikey: "${env.VIRUSTOTAL_API_KEY}"
functions:
  list_threats:
    description: List threats from VirusTotal.
    args:
      filter:
        type: string
        required: true
        description: Filter to apply to the list of threats.
      limit:
        type: number
        required: false
        default: 10
        description: Maximum number of threats to return.
    request:
      method: GET
      url: https://www.virustotal.com/api/v3/collections
      query:
        filter: "${args.filter}"
        limit: "${args.limit}"
  lookup_domain:
    description: Get VirusTotal report for a domain.
    args:
      domain:
        type: string
        required: true
        description: Domain to lookup.
    request:
      method: GET
      url: "https://www.virustotal.com/api/v3/domains/${args.domain}"
  lookup_file_hash:
    description: Get VirusTotal report for a file hash.
    args:
      file_hash:
        type: string
        required: true
        description: File hash to lookup.
    request:
      method: GET
      url: "https://www.virustotal.com/api/v3/files/${args.file_hash}"
  lookup_ip_address:
    description: Get VirusTotal report for an IP address.
    args:
      ip_address:
        type: string
        required: true
        description: IP address to lookup.
    request:
      method: GET
      url: "https://www.virustotal.com/api/v3/ip_addresses/${args.ip_address}"
  list_subdomains:
    description: List known subdomains for a domain, from VirusTotal's passive DNS data.
    args:
      domain:
        type: string
        required: true
        description: Domain to enumerate subdomains for.
      limit:
        type: number
        required: false
        default: 40
        description: Maximum number of subdomains to return.
    request:
      method: GET
      url: "https://www.virustotal.com/api/v3/domains/${args.domain}/subdomains"
      query:
        limit: "${args.limit}"
  submit_url_scan:
    description: Submit a URL to VirusTotal for scanning. Response includes an analysis ID; pass it to get_url_analysis to retrieve results.
    args:
      url:
        type: string
        required: true
        description: URL to submit for scanning.
    request:
      method: POST
      url: https://www.virustotal.com/api/v3/urls
      headers:
        Content-Type: application/x-www-form-urlencoded
      body:
        url: "${args.url}"
  get_url_analysis:
    description: Fetch results of a previously submitted URL scan by analysis ID. Follow-up call after submit_url_scan.
    args:
      analysis_id:
        type: string
        required: true
        description: Analysis ID returned by submit_url_scan.
    request:
      method: GET
      url: "https://www.virustotal.com/api/v3/analyses/${args.analysis_id}"
